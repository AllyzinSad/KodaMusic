name: Koda Anime TV APK
on:
  push:
    branches: [ koda-anime-tv-test ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Probe public anime catalog
        run: |
          for url in "https://animestvs.org/animes-dublados" "https://animestvs.org/episodios-recentes-dublados"; do
            echo "PROBE $url"
            curl -L --max-time 12 -sS -o /tmp/koda-response -w 'STATUS=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' "$url" || true
            head -c 320 /tmp/koda-response 2>/dev/null || true
            echo
          done
      - run: gradle -p KodaAnimeTV :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KodaAnimeTV-debug-apk
          path: KodaAnimeTV/app/build/outputs/apk/debug/app-debug.apk
