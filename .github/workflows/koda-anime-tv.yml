name: Koda Anime TV APK
on:
  push:
    branches: [ koda-anime-tv-test, koda-anime-0.18 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build
        run: gradle -p KodaAnimeTV :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KodaAnimeTV-0.18-apk
          path: KodaAnimeTV/app/build/outputs/apk/debug/app-debug.apk
      - name: Package complete source
        run: |
          rm -rf KodaAnimeTV/app/build KodaAnimeTV/.gradle
          zip -r KodaAnimeTV-0.18-source.zip KodaAnimeTV \
            -x "KodaAnimeTV/.git/*" \
               "KodaAnimeTV/**/.gradle/*" \
               "KodaAnimeTV/**/build/*"
      - uses: actions/upload-artifact@v4
        with:
          name: KodaAnimeTV-0.18-source
          path: KodaAnimeTV-0.18-source.zip
