name: Koda Music Android TV Preview

on:
  push:
    branches: [koda-android-tv-preview-build]
  pull_request:
    branches: [koda-android-final-3110]
  workflow_dispatch:

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build TV Debug APK
        run: |
          chmod +x gradlew
          ./gradlew -PincludeAndroid=true :app:assembleTvDebug
      - name: Upload universal TV APK
        uses: actions/upload-artifact@v4
        with:
          name: KodaMusic-TV-Preview-APK
          path: app/build/outputs/apk/tv/debug/*universal*.apk
          if-no-files-found: error
