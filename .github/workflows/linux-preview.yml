name: Koda Music Linux Preview

on:
  push:
    branches: [koda-linux-3110-preview]
  pull_request:
    branches: [koda-windows-3.11-handoff]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Linux portable package
        run: |
          chmod +x gradlew
          ./gradlew :desktop:linuxPortableTar --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KodaMusic-3.11.0-Linux-x64
          path: release/KodaMusic-3.11.0-Linux-x64.tar.gz
          if-no-files-found: error
